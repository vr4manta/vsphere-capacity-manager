apiVersion: apps/v1
kind: Deployment
metadata:
  name: vsphere-capacity-manager-console-plugin
  namespace: vsphere-infra-helpers
  labels:
    app: vsphere-capacity-manager-console-plugin
    app.kubernetes.io/name: vsphere-capacity-manager-console-plugin
    app.kubernetes.io/component: console-plugin
    app.kubernetes.io/part-of: vsphere-capacity-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vsphere-capacity-manager-console-plugin
  template:
    metadata:
      labels:
        app: vsphere-capacity-manager-console-plugin
    spec:
      serviceAccountName: vsphere-capacity-manager-console-plugin
      containers:
      - name: vsphere-capacity-manager-console-plugin
        image: quay.io/openshift-splat-team/vsphere-capacity-manager-console-plugin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9443
          protocol: TCP
          name: https
        volumeMounts:
        - name: serving-cert
          readOnly: true
          mountPath: /var/serving-cert
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: serving-cert
        secret:
          secretName: vsphere-capacity-manager-console-plugin-cert
          defaultMode: 420
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
